<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Petalfall — a quiet space to grow</title>
    <meta name="description" content="Your quiet space — activities, habits, savings & journal." />
    <!-- Personal app: keep it out of search engines. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0F0B0D" />
    <!-- Link unfurls (independent of noindex): nice previews when shared -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Petalfall — a quiet space to grow" />
    <meta property="og:description" content="Your quiet space — activities, habits, savings & journal. Free, local-first, no tracking; your weeks grow a 3D garden." />
    <meta property="og:image" content="https://petalfall.vercel.app/og.png" />
    <meta property="og:url" content="https://petalfall.vercel.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Petalfall — a quiet space to grow" />
    <meta name="twitter:description" content="Free, local-first life tracker — no tracking; your weeks grow a 3D garden." />
    <meta name="twitter:image" content="https://petalfall.vercel.app/og.png" />
    <!-- FOUC guard: apply the saved theme before first paint -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("nadya:settings") || "{}");
        if (s.theme && s.theme !== "rose") document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Petalfall" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
